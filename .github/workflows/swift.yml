# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-latest
    defaults:
      run:
        working-directory: SwiftPlayground

    steps:
    - uses: actions/checkout@v4
    - name: Type-check iPad app sources
      shell: bash
      run: |
        sdk_path="$(xcrun --sdk iphonesimulator --show-sdk-path)"
        find . -maxdepth 1 -name '*.swift' ! -name 'Package.swift' -print0 \
          | xargs -0 xcrun swiftc -typecheck \
              -sdk "$sdk_path" \
              -target arm64-apple-ios17.6-simulator \
              -module-name ContestTracker
