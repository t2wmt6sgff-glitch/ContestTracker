name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Type-check iPad app sources
      working-directory: SwiftPlayground
      shell: bash
      run: |
        sdk_path="$(xcrun --sdk iphonesimulator --show-sdk-path)"
        find . -maxdepth 1 -name '*.swift' ! -name 'Package.swift' -print0 \
          | xargs -0 xcrun swiftc -typecheck \
              -sdk "$sdk_path" \
              -target arm64-apple-ios17.6-simulator \
              -module-name ContestTracker

    - name: Create Swift Playgrounds app package
      shell: bash
      run: |
        rm -rf artifact
        mkdir -p artifact/ContestTracker.swiftpm

        rsync -a \
          --exclude '.DS_Store' \
          SwiftPlayground/ \
          artifact/ContestTracker.swiftpm/

        test -f artifact/ContestTracker.swiftpm/Package.swift

    - name: Upload Swift Playgrounds package
      uses: actions/upload-artifact@v4
      with:
        name: ContestTracker-swiftpm-${{ github.sha }}
        path: artifact/ContestTracker.swiftpm
        if-no-files-found: error
        retention-days: 30
